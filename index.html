<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My-form</title>
    <style>
        .container{
            justify-content: center;
            gap: 10px;
            }

label{
    font-size: 20px;
    font-weight: 200px;
    color: rgb(1, 10, 12);
}
input{
    width: 450px; 
    height: 30px;
    border-radius: 20px;
    background-color: rgb(232, 239, 239);
    font-size: 15px;
}
#surname{
    background-color: solid rgba(26, 229, 121, 0.721);
}
.btns{    display: flex;
    gap: 10px;
    justify-content: end ;
    border-radius: 8px;
    border: none;
    color: rgb(28, 22, 22);
    background-color: rgb(237, 247, 247);
    padding: 10px 20px;
    font-size: 20px;
    opacity: 1;
}
    </style>
</head>
<body>
   <form method="get" style="background-color: rgb(55, 48, 186); width: 1500px; height: 1000px;">
    <div class="container">
<label for="name">Name</label> 
<br>
<input type="text" name=" name" placeholder="name"> 
<br>       
<label for="surname">Surname</label> <br>
<input id="surname" name="surname" placeholder="surname">
<br>
<label for="age">Age</label>
 <br>
<input type="text" name="age" placeholder="age">
<br>
<label for="password">Password</label>
<br>
<input type="text" name="password" placeholder="password">
<br>
<label for="email">Email</label>
<br>
<input type="text" name="email" placeholder="email">
<br>
<label for="telephone">Telephone</label>
<br>
<input type="text" name="telephone" placeholder="telephone">

<br>
<br>
<div class="btns" style="font-size: 20;">
<button  type="submit">Submit

</button>
<button type="reset">
    Reset
</button>
</div>
<br>
<br>
<div style="font-size: 20;">
    Choose your gender
</div>
<input type="radio" > <span>male</span>
<input type="radio" > <span>female</span>
<br>
<br>
<div style="font-size: 30;"> 
   Add Cv 
</div>
<input type="file"name="file">
<br>
<br>
<div> 
    If you have any additional information you would like to add, please write it down.
</div>
<textarea name="message" id="" placeholder="message"></textarea>
<br>
<div>
    Choose your job
</div>
<select name="jobs" id="" multiple>
    <option value="Software Engineer">Software Engineer</option>
    <option value="Front-end Developer">Front-end Developer</option>
    <option value="Backend Developer">Backend Developer</option>
    <option value="Data Scientist" disabled> Data Scientist </option>

   </form> 
</body>
</html>
